<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#00ff88" stroke-width="2" rx="8"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#00ff88" stroke-width="1" rx="6" opacity="0.5"/>

  <!-- Trophy Icon -->
  <g transform="translate(200, 80)">
    <path d="M -30,-20 L -30,-10 L -25,-5 L -25,10 L 25,10 L 25,-5 L 30,-10 L 30,-20 Z" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <ellipse cx="0" cy="-20" rx="30" ry="5" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <rect x="-8" y="10" width="16" height="15" fill="#B8860B"/>
    <rect x="-15" y="25" width="30" height="5" fill="#B8860B" rx="2"/>
    <path d="M -35,-15 Q -45,-10 -45,0 Q -45,10 -35,12 L -30,5" fill="none" stroke="#00ff88" stroke-width="2"/>
    <path d="M 35,-15 Q 45,-10 45,0 Q 45,10 35,12 L 30,5" fill="none" stroke="#00ff88" stroke-width="2"/>
  </g>

  <!-- Text -->
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#00ff88" text-anchor="middle">
    Principal Engineer
  </text>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.9">
    Promotion Achievement
  </text>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="16" fill="#00ff88" text-anchor="middle" opacity="0.8">
    G2 • 2026
  </text>

  <!-- Decorative stars -->
  <text x="120" y="145" font-size="20" fill="#FFD700">★</text>
  <text x="280" y="145" font-size="20" fill="#FFD700">★</text>
</svg>
