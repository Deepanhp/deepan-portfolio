<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad5)"/>
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#4facfe" stroke-width="2" rx="8"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#f093fb" stroke-width="1" rx="6" opacity="0.5"/>

  <!-- Medal Icon with 3rd Place -->
  <g transform="translate(200, 80)">
    <!-- Medal circle -->
    <circle cx="0" cy="0" r="32" fill="#CD7F32" stroke="#8B4513" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="#E6962D" stroke="#CD7F32" stroke-width="1"/>

    <!-- Number 3 -->
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    <!-- Ribbons -->
    <path d="M -15,-28 L -20,-32 L -18,-50 L -15,-30" fill="#4facfe"/>
    <path d="M 15,-28 L 20,-32 L 18,-50 L 15,-30" fill="#f093fb"/>
  </g>

  <!-- Text -->
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    G2 Hackathon FY25
  </text>
  <text x="200" y="168" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFD700" text-anchor="middle">
    3rd Place
  </text>
  <text x="200" y="198" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.9">
    G2 • 2025
  </text>

  <!-- Code brackets decoration -->
  <text x="120" y="170" font-size="24" fill="#4facfe" opacity="0.5">&lt;/&gt;</text>
  <text x="260" y="170" font-size="24" fill="#f093fb" opacity="0.5">&lt;/&gt;</text>
</svg>
