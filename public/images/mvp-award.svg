<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad4)"/>
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fc5c7d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a82fb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#ff6b9d" stroke-width="2" rx="8"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#ff6b9d" stroke-width="1" rx="6" opacity="0.5"/>

  <!-- MVP Star Icon -->
  <g transform="translate(200, 85)">
    <path d="M 0,-30 L 7,-10 L 28,-10 L 11,3 L 18,23 L 0,10 L -18,23 L -11,3 L -28,-10 L -7,-10 Z"
          fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Most Valuable
  </text>
  <text x="200" y="168" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Professional
  </text>
  <text x="200" y="198" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.9">
    G2 • 2024
  </text>

  <!-- Decorative elements -->
  <circle cx="120" cy="150" r="4" fill="#FFD700" opacity="0.6"/>
  <circle cx="280" cy="150" r="4" fill="#FFD700" opacity="0.6"/>
  <text x="135" y="160" font-size="14" fill="#FFD700" opacity="0.8">★</text>
  <text x="265" y="160" font-size="14" fill="#FFD700" opacity="0.8">★</text>
</svg>
