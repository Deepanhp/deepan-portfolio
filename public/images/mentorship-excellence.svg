<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad3)"/>
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#a78bfa" stroke-width="1" rx="6" opacity="0.5"/>

  <!-- Mentorship Icon (People connected) -->
  <g transform="translate(200, 80)">
    <!-- Center person -->
    <circle cx="0" cy="-10" r="12" fill="#ffffff" opacity="0.9"/>
    <path d="M -15,5 Q 0,0 15,5 L 12,25 L -12,25 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Left person (smaller) -->
    <circle cx="-40" cy="0" r="10" fill="#a78bfa" opacity="0.7"/>
    <path d="M -52,12 Q -40,8 -28,12 L -30,28 L -50,28 Z" fill="#a78bfa" opacity="0.7"/>

    <!-- Right person (smaller) -->
    <circle cx="40" cy="0" r="10" fill="#a78bfa" opacity="0.7"/>
    <path d="M 28,12 Q 40,8 52,12 L 50,28 L 30,28 Z" fill="#a78bfa" opacity="0.7"/>

    <!-- Connection lines -->
    <line x1="-28" y1="15" x2="-12" y2="15" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
    <line x1="12" y1="15" x2="28" y2="15" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Technical Mentorship
  </text>
  <text x="200" y="165" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Excellence
  </text>
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.9">
    G2 • 2024
  </text>

  <!-- Decorative stars -->
  <text x="140" y="150" font-size="16" fill="#ffd700" opacity="0.8">★</text>
  <text x="260" y="150" font-size="16" fill="#ffd700" opacity="0.8">★</text>
</svg>
