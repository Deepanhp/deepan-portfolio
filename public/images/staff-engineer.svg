<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad2)"/>
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#203a43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#4a90e2" stroke-width="2" rx="8"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#4a90e2" stroke-width="1" rx="6" opacity="0.5"/>

  <!-- Badge Icon -->
  <g transform="translate(200, 75)">
    <circle cx="0" cy="0" r="35" fill="#4a90e2" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="url(#badgeGrad)" stroke="#4a90e2" stroke-width="2"/>
    <defs>
      <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#5dade2;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
      </linearGradient>
    </defs>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
    <polygon points="0,35 -8,50 -8,60 0,55 8,60 8,50" fill="#4a90e2"/>
    <polygon points="0,35 8,50 8,60 0,55 -8,60 -8,50" fill="#3498db"/>
  </g>

  <!-- Text -->
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4a90e2" text-anchor="middle">
    Staff Engineer
  </text>
  <text x="200" y="175" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.9">
    Technical Leadership
  </text>
  <text x="200" y="205" font-family="Arial, sans-serif" font-size="16" fill="#4a90e2" text-anchor="middle" opacity="0.8">
    G2 • 2024
  </text>

  <!-- Decorative elements -->
  <circle cx="100" cy="140" r="3" fill="#4a90e2" opacity="0.6"/>
  <circle cx="110" cy="135" r="2" fill="#4a90e2" opacity="0.4"/>
  <circle cx="300" cy="140" r="3" fill="#4a90e2" opacity="0.6"/>
  <circle cx="290" cy="135" r="2" fill="#4a90e2" opacity="0.4"/>
</svg>
